name: release

# Publish a GitHub Release automatically whenever a vX.Y.Z tag is pushed.
# Artifacts come from releases/<tag>/ (committed by the release engineer,
# built via scripts/build-*). Changelog = releases/<tag>/RELEASES.md plus
# GitHub's auto-generated commit notes. Engine CLI binaries for six
# OS/arch targets are built in CI and attached as extra assets, so every
# future release publishes itself end to end.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────── publish committed artifacts + notes ────────
  publish:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ -f "releases/${TAG_NAME}/RELEASES.md" ]]; then
            cp "releases/${TAG_NAME}/RELEASES.md" body.md
            echo "notes: releases/${TAG_NAME}/RELEASES.md"
          else
            {
              echo "## Changes in ${TAG_NAME}"
              echo
              git log --oneline --no-decorate -20
            } > body.md
            echo "notes: auto-generated from commit log"
          fi

      - name: Publish release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: AegisVPN ${{ github.ref_name }}
          body_path: body.md
          generate_release_notes: true
          files: releases/${{ github.ref_name }}/*
          fail_on_unmatched_files: false

  # ─────────────────────────── engine CLI binaries (six targets) ──────────
  engine-binaries:
    name: engine binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: engine/go.sum
      - name: Build
        working-directory: engine
        run: go build -trimpath -o "../aegisvpn-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/aegisvpn
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: aegisvpn-cli-${{ matrix.goos }}-${{ matrix.goarch }}*
          fail_on_unmatched_files: true
