# Gradle wrapper configuration for the AegisVPN Android app.
#
# NOTE: gradle-wrapper.jar is a binary and is intentionally NOT checked in as
# text here. scripts/build-android.sh regenerates the full wrapper by running
# `gradle wrapper --gradle-version 8.9` (using a locally installed Gradle or a
# downloaded Gradle 8.9 distribution) before invoking ./gradlew.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
